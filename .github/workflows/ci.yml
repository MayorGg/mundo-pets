name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mundo_pets
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test
      DB_NAME: mundo_pets
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/mundo_pets
      JWT_SECRET: ci-secret-de-prueba
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm --prefix backend ci
      - name: Generar cliente Prisma
        run: npx prisma generate
        working-directory: backend
      - name: Crear esquema (prisma db push)
        run: npx prisma db push
        working-directory: backend
      - name: Typecheck (tsc --noEmit)
        run: npm --prefix backend run typecheck
      - name: Crear esquema y datos base (seed)
        run: node backend/seed.js
      - name: Tests de API
        run: npm --prefix backend run test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm --prefix frontend ci
      - name: Compilar Tailwind y generar páginas
        run: npm --prefix frontend run build
      - name: Verificar sintaxis JS
        run: |
          node --check frontend/script.js
          node --check frontend/admin.js
          node --check frontend/catalogo.js