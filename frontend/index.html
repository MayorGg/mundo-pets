<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="overlay">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-6 col-md-8 col-sm-12">
          <div class="text-center">
            <div class="page-kicker mb-4">
              <div class="hero-mark">
                <i class="fas fa-paw fa-2x"></i>
              </div>
              <h1 class="display-4 fw-bold mb-2">Mundo Pets</h1>
              <p class="lead mb-0">Cuidado profesional para tu mascota</p>
            </div>

            <div class="card border-0 rounded-4 p-4 p-md-5">
              <div class="card-body p-0">
                <h2 class="h4 text-primary mb-2">Bienvenido</h2>
                <p class="text-muted mb-4">
                  Accede a tu cuenta para ver el catálogo, servicios y beneficios.
                </p>

                <div class="d-grid gap-3">
                  <button onclick="location.href='login.html'" class="btn btn-primary btn-lg">
                    Iniciar sesión
                  </button>
                  <button onclick="location.href='register.html'" class="btn btn-outline-primary btn-lg">
                    Crear cuenta
                  </button>
                </div>

                <div class="row mt-5 g-3">
                  <div class="col-4">
                    <i class="fas fa-paw text-primary mb-2"></i>
                    <p class="small text-muted mb-0">Servicios</p>
                  </div>
                  <div class="col-4">
                    <i class="fas fa-shield-alt text-primary mb-2"></i>
                    <p class="small text-muted mb-0">Confianza</p>
                  </div>
                  <div class="col-4">
                    <i class="fas fa-heart text-primary mb-2"></i>
                    <p class="small text-muted mb-0">Cuidado</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="card border-0 rounded-4 p-4 mt-4">
              <div class="card-body p-0 text-center">
                <p class="small text-muted text-uppercase mb-3" style="letter-spacing: 0.08em;">Contacto</p>
                <div class="d-flex justify-content-center gap-2 flex-wrap social-row">
                  <a href="https://www.tiktok.com/@mundo.pets91?_t=ZS-8ywbAn9fLAV&_r=1"
                     class="btn btn-outline-dark rounded-pill"
                     target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-tiktok me-1"></i> TikTok
                  </a>
                  <a href="https://www.instagram.com/official_mundopets?igsh=MXMxeXJlNGRjN2R4Ng%3D%3D&utm_source=qr"
                     class="btn btn-outline-dark rounded-pill"
                     target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram me-1"></i> Instagram
                  </a>
                  <a href="https://wa.me/573017810651?text=Hola,%20estoy%20interesado/a%20por%20tus%20servicios"
                     class="btn btn-outline-dark rounded-pill"
                     target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp me-1"></i> WhatsApp
                  </a>
                </div>
              </div>
            </div>

            <p class="small mt-4 mb-0" style="color: rgba(255,255,255,0.85);">
              © 2026 Mundo Pets
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
