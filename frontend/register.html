<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Mundo Pets</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css?v=13" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="overlay">
    <div class="flex min-h-screen items-center justify-center px-4 py-6">
      <div class="w-full max-w-2xl">
        <div class="page-kicker mb-4 text-center">
          <a href="index.html" class="no-underline">
            <div class="hero-mark mb-3">
              <i class="fas fa-paw fa-lg"></i>
            </div>
            <h1 class="mb-0 text-2xl font-bold">Mundo Pets</h1>
          </a>
        </div>

        <div class="glass-card rounded-card shadow-card">
          <div class="p-8">
            <div class="mb-4 text-center">
              <h2 class="mb-2 text-xl font-bold text-brand">Crear cuenta</h2>
              <p class="mb-0 text-muted">Únete a la comunidad Mundo Pets</p>
            </div>

            <form novalidate>
              <div class="grid gap-4 sm:grid-cols-2">
                <div>
                  <label for="newUsername" class="mb-1.5 block text-sm font-semibold text-muted">
                    <i class="fas fa-user mr-2"></i>Usuario
                  </label>
                  <input type="text" class="input-field w-full px-4 py-3" id="newUsername"
                         placeholder="Elige un nombre de usuario" autocomplete="username" required>
                  <p id="newUsername-err" class="mt-1.5 hidden text-sm font-medium text-danger"></p>
                </div>

                <div>
                  <label for="newEmail" class="mb-1.5 block text-sm font-semibold text-muted">
                    <i class="fas fa-envelope mr-2"></i>Correo Electrónico
                  </label>
                  <input type="email" class="input-field w-full px-4 py-3" id="newEmail"
                         placeholder="tu@email.com" autocomplete="email" required>
                  <p id="newEmail-err" class="mt-1.5 hidden text-sm font-medium text-danger"></p>
                </div>
              </div>

              <div class="mt-4">
                <label for="newPassword" class="mb-1.5 block text-sm font-semibold text-muted">
                  <i class="fas fa-lock mr-2"></i>Contraseña
                </label>
                <div class="relative">
                  <input type="password" class="input-field w-full px-4 py-3 pr-11" id="newPassword"
                         placeholder="Crea una contraseña segura" autocomplete="new-password" required>
                  <button type="button" onclick="togglePassword('newPassword','togglePassReg')"
                          class="absolute top-1/2 right-3 -translate-y-1/2 text-muted transition hover:text-brand"
                          aria-label="Mostrar contraseña" title="Mostrar contraseña">
                    <i id="togglePassReg" class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="mt-1.5 text-sm text-muted">
                  <i class="fas fa-info-circle mr-1"></i>Mínimo 6 caracteres
                </div>
                <p id="newPassword-err" class="mt-1.5 hidden text-sm font-medium text-danger"></p>
              </div>

              <div class="mt-4">
                <button type="button" id="registerBtn" onclick="register()" class="btn-brand w-full px-6 py-3 text-base">
                  <i class="fas fa-user-plus"></i>Crear Cuenta
                </button>
              </div>

              <div class="mt-4 text-center">
                <p class="mb-0 text-muted">
                  ¿Ya tienes cuenta?
                  <a href="login.html" class="font-bold text-brand no-underline">
                    Inicia sesión aquí
                  </a>
                </p>
              </div>
            </form>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-3 gap-3">
          <div class="text-center">
            <i class="fas fa-gift mb-2 text-2xl text-success"></i>
            <p class="mb-0 text-sm text-muted">Descuentos</p>
          </div>
          <div class="text-center">
            <i class="fas fa-shipping-fast mb-2 text-2xl text-brand"></i>
            <p class="mb-0 text-sm text-muted">Envío Gratis</p>
          </div>
          <div class="text-center">
            <i class="fas fa-star mb-2 text-2xl text-warn"></i>
            <p class="mb-0 text-sm text-muted">Ofertas VIP</p>
          </div>
        </div>

        <div class="mt-4 text-center">
          <p class="mb-0 text-sm text-white/85">© 2026 Mundo Pets</p>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/alpine.min.js"></script>
  <script src="script.js?v=13"></script>
</body>
</html>
