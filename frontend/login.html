<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Mundo Pets</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css?v=1" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="overlay">
    <div class="flex min-h-screen items-center justify-center px-4 py-6">
      <div class="w-full max-w-md">
        <div class="page-kicker mb-4 text-center">
          <a href="index.html" class="no-underline">
            <div class="hero-mark mb-3">
              <i class="fas fa-paw fa-lg"></i>
            </div>
            <h1 class="mb-0 text-2xl font-bold">Mundo Pets</h1>
          </a>
        </div>

        <div class="glass-card rounded-card shadow-card">
          <div class="p-8">
            <div class="mb-4 text-center">
              <h2 class="mb-2 text-xl font-bold text-brand">Iniciar sesión</h2>
              <p class="mb-0 text-muted">Accede a tu cuenta para continuar</p>
            </div>

            <form novalidate>
              <div class="mb-3">
                <label for="identifier" class="mb-1.5 block text-sm font-semibold text-muted">
                  <i class="fas fa-user mr-2"></i>Usuario o Correo
                </label>
                <input type="text" class="input-field w-full px-4 py-3" id="identifier"
                       placeholder="Ingresa tu usuario o email" autocomplete="username" required>
                <p id="identifier-err" class="mt-1.5 hidden text-sm font-medium text-danger"></p>
              </div>

              <div class="mb-4">
                <label for="password" class="mb-1.5 block text-sm font-semibold text-muted">
                  <i class="fas fa-lock mr-2"></i>Contraseña
                </label>
                <div class="relative">
                  <input type="password" class="input-field w-full px-4 py-3 pr-11" id="password"
                         placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                  <button type="button" onclick="togglePassword('password','togglePass')"
                          class="absolute top-1/2 right-3 -translate-y-1/2 text-muted transition hover:text-brand"
                          aria-label="Mostrar contraseña" title="Mostrar contraseña">
                    <i id="togglePass" class="fas fa-eye"></i>
                  </button>
                </div>
                <p id="password-err" class="mt-1.5 hidden text-sm font-medium text-danger"></p>
              </div>

              <div class="mb-4">
                <button type="button" id="loginBtn" onclick="login()" class="btn-brand w-full px-6 py-3 text-base">
                  <i class="fas fa-sign-in-alt"></i>Entrar
                </button>
              </div>

              <div class="text-center">
                <p class="mb-0 text-muted">
                  ¿No tienes cuenta?
                  <a href="register.html" class="font-bold text-brand no-underline">
                    Regístrate aquí
                  </a>
                </p>
              </div>
            </form>
          </div>
        </div>

        <div class="mt-4 text-center">
          <p class="mb-0 text-sm text-white/85">© 2026 Mundo Pets</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>
