# ===== Mundo Pets — Nginx reverse proxy =====
# Requisitos: Nginx + certbot instalados. Reemplaza TU_DOMINIO por el tuyo.
# Después de crear este archivo: sudo ln -s /etc/nginx/sites-available/mundo-pets /etc/nginx/sites-enabled/
# Luego: sudo certbot --nginx -d TU_DOMINIO -d www.TU_DOMINIO

# Redirigir HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO www.TU_DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Rutas generadas por certbot (letsencrypt/live/TU_DOMINIO)
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    # Cabeceras de seguridad (helmet ya las pone a nivel de app; refuerzo básico aquí)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Comprimir respuestas textuales
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Estáticos versionados (CSS/JS/imágenes) -> cache largo
    location ~* \.(css|js|svg|webp|png|jpe?g|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demás (HTML y /api) va al backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}